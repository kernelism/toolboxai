[tool.poetry]
name = "toolboxai-backend"
version = "0.1.0"
description = "ToolboxAI Backend"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.104.1"
uvicorn = "0.24.0"
PyMuPDF = "1.23.8"
python-multipart = "0.0.6"
python-dotenv = "1.0.0"
openai = "1.3.0"
anthropic = "0.5.0"
tomli = "2.0.1"
requests = "2.31.0"
pydantic-settings = "2.1.0"
chromadb = "0.4.18"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api" 